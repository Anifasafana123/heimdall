<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Network Monitoring</title>
  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
</head>
<body class="min-h-full bg-slate-50 text-slate-800">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
        <h1 class="text-lg font-semibold">Network Monitoring System</h1>
      </div>
      <div class="flex items-center gap-4 text-sm text-slate-500">
        <span>{{ username }}</span>
        <a href="/logout" class="text-sky-600 hover:underline">Logout</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Computers panel: auto-refreshes via HTMX -->
      <section class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 shadow-sm">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <h2 class="font-semibold">Registered Computers</h2>
          <span class="text-xs text-slate-400">auto-refresh 15s</span>
        </div>
        <div id="computers"
             hx-get="/partials/computers"
             hx-trigger="load, every 15s"
             hx-swap="innerHTML">
          <div class="p-6 text-slate-400 text-sm">Loading computers…</div>
        </div>
      </section>

      <!-- Metrics panel: populated when a computer is selected -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm">
        <div class="px-6 py-4 border-b border-slate-100">
          <h2 class="font-semibold">Recent Metrics</h2>
        </div>
        <div id="metrics" class="p-6 text-slate-400 text-sm">
          Select a computer to view metrics.
        </div>
      </section>
    </div>
  </main>
</body>
</html>
