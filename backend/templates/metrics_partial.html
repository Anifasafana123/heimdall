{% if computer %}
<div class="mb-3">
  <h3 class="font-medium text-slate-900">{{ computer.hostname }}</h3>
  <p class="text-xs text-slate-500">{{ computer.ip_address }} · {{ computer.owner }}</p>
</div>
{% endif %}

{% if metrics %}
<div class="space-y-2">
  {% for m in metrics %}
  <div class="flex items-center justify-between rounded-lg bg-slate-50 px-3 py-2">
    <span class="text-xs font-medium text-slate-500 uppercase tracking-wide">{{ m.metric_kind }}</span>
    <span class="text-sm font-semibold text-slate-900">{{ m.value }}</span>
    <span class="text-xs text-slate-400">{{ m.recorded_at }}</span>
  </div>
  {% endfor %}
</div>
{% else %}
<p class="text-slate-400 text-sm">No metrics reported for this computer yet.</p>
{% endif %}
